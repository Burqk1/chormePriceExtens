<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<h3>Right-click each icon below and "Save image as..." to the icons/ folder</h3>
<p>Or just load the extension — Chrome will use the default icon if PNGs are missing.</p>
<div style="display:flex;gap:20px;align-items:end;margin:20px;">
  <div>
    <canvas id="c16" width="16" height="16"></canvas>
    <p>icon16.png</p>
  </div>
  <div>
    <canvas id="c48" width="48" height="48"></canvas>
    <p>icon48.png</p>
  </div>
  <div>
    <canvas id="c128" width="128" height="128"></canvas>
    <p>icon128.png</p>
  </div>
</div>
<script>
function drawIcon(id, size) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.2);
  ctx.fill();
  // Pulse line
  ctx.strokeStyle = '#f27a1a';
  ctx.lineWidth = size * 0.08;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const s = size;
  ctx.moveTo(s*0.1, s*0.5);
  ctx.lineTo(s*0.3, s*0.5);
  ctx.lineTo(s*0.4, s*0.2);
  ctx.lineTo(s*0.6, s*0.8);
  ctx.lineTo(s*0.7, s*0.5);
  ctx.lineTo(s*0.9, s*0.5);
  ctx.stroke();
}
drawIcon('c16', 16);
drawIcon('c48', 48);
drawIcon('c128', 128);
</script>
</body>
</html>
